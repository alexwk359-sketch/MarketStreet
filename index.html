<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#e76f51" />
    <title>Market Street</title>
    <link rel="icon" href="sprites/ui/store.png" />
  </head>
  <body>
    <div id="game"></div>
    <header id="hud"></header>
    <div id="order" hidden></div>
    <div id="placing" hidden></div>
    <aside id="panel" hidden></aside>
    <nav id="toolbar">
      <button data-tool="build"><img src="sprites/ui/build.png" alt="" /><span>Construir</span></button>
      <button data-tool="decor"><img src="sprites/ui/palette.png" alt="" /><span>Decorar</span></button>
      <button data-tool="tasks"><img src="sprites/ui/clipboard.png" alt="" /><span>Tareas</span><b id="tasks-badge" class="badge" hidden></b></button>
      <button data-tool="upgrades"><img src="sprites/ui/rocket.png" alt="" /><span>Mejoras</span></button>
      <button data-tool="stats"><img src="sprites/ui/chart.png" alt="" /><span>Datos</span></button>
      <button data-tool="menu" class="menu-btn"><img src="sprites/ui/gear.png" alt="" /><span>Menú</span></button>
    </nav>
    <div id="modal" hidden></div>
    <div id="toasts"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
